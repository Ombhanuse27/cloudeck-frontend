<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard - Login</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #1abc9c;
            --light: #f8f9fa;
            --dark: #2c3e50;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.7);
            z-index: 0;
        }
        
        .auth-container {
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
            z-index: 1;
        }
        
        .auth-container:hover {
            transform: translateY(-5px);
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--secondary), var(--accent));
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        h1 {
            color: var(--primary);
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 28px;
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 500;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .input-container {
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background-color: #f8f9fa;
        }
        
        input:focus {
            border-color: var(--secondary);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
            outline: none;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            transition: color 0.3s;
        }
        
        input:focus + .input-icon {
            color: var(--secondary);
        }
        
        button {
            background: linear-gradient(to right, var(--secondary), var(--accent));
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }
        
        button:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }
        
        .auth-toggle {
            margin-top: 25px;
            color: var(--dark);
            font-size: 14px;
        }
        
        .auth-toggle a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }
        
        .auth-toggle a:hover {
            color: var(--accent);
        }
        
        .auth-toggle a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s;
        }
        
        .auth-toggle a:hover::after {
            width: 100%;
        }
        
        .form-switch {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
        }
        
        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        
        .floating-element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: -40px;
            right: -40px;
        }
        
        .floating-element:nth-child(2) {
            width: 60px;
            height: 60px;
            bottom: 20px;
            left: -30px;
        }
        
        .floating-element:nth-child(3) {
            width: 40px;
            height: 40px;
            bottom: 60px;
            right: 20px;
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 25px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="floating-elements">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>
        
        <div class="logo-container">
            <div class="logo">IoT</div>
        </div>
        <h1>Welcome to CloudLynk</h1>
        
        <div id="login-form" class="form-switch">
            <div class="form-group">
                <label for="login-email">Email</label>
                <div class="input-container">
                    <input type="email" id="login-email" placeholder="Enter your email">
                    <span class="input-icon">✉️</span>
                </div>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="input-container">
                    <input type="password" id="login-password" placeholder="Enter your password">
                    <span class="input-icon">🔒</span>
                </div>
            </div>
            <button id="login-btn">Login</button>
            <div class="auth-toggle">
                Don't have an account? <a href="#" id="show-signup">Sign up</a>
            </div>
        </div>
        
        <div id="signup-form" class="form-switch" style="display: none;">
            <div class="form-group">
                <label for="signup-name">Name</label>
                <div class="input-container">
                    <input type="text" id="signup-name" placeholder="Enter your name">
                    <span class="input-icon">👤</span>
                </div>
            </div>
            <div class="form-group">
                <label for="signup-email">Email</label>
                <div class="input-container">
                    <input type="email" id="signup-email" placeholder="Enter your email">
                    <span class="input-icon">✉️</span>
                </div>
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <div class="input-container">
                    <input type="password" id="signup-password" placeholder="Create a password">
                    <span class="input-icon">🔒</span>
                </div>
            </div>
            <button id="signup-btn">Create Account</button>
            <div class="auth-toggle">
                Already have an account? <a href="#" id="show-login">Login</a>
            </div>
        </div>
    </div>

<script>

const API_BASE = "https://cloudeck-backend.onrender.com/api";

document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');

            document.getElementById('show-signup').addEventListener('click', function(e) {
                e.preventDefault();
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            });

            document.getElementById('show-login').addEventListener('click', function(e) {
                e.preventDefault();
                signupForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            // Backend login
            document.getElementById('login-btn').addEventListener('click', async function() {
                const usernameOrEmail = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                if (!usernameOrEmail || !password) {
                    alert('Please fill all fields');
                    return;
                }

                const payload = { username: usernameOrEmail, password };

                try {
                    const response = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        alert('Login failed: ' + errorText);
                        return;
                    }

                    const data = await response.json();
                    localStorage.setItem('jwtToken', data.token);

                    window.location.href = 'dashboard.html';
                } catch (err) {
                    console.error(err);
                    alert('Something went wrong.');
                }
            });

            // Backend signup
            document.getElementById('signup-btn').addEventListener('click', async function() {
                const username = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;

                if (!username || !email || !password) {
                    alert('Please fill all fields');
                    return;
                }

                const payload = { username, email, password };

                try {
       const response = await fetch(`${API_BASE}/auth/register`, {

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        alert('Signup failed: ' + errorText);
                        return;
                    }

                    alert('Account created! Please login.');
                    signupForm.style.display = 'none';
                    loginForm.style.display = 'block';
                } catch (err) {
                    console.error(err);
                    alert('Something went wrong.');
                }
            });
        });
    </script>
</body>
</html>
